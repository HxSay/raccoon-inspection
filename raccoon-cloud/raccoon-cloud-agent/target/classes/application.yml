server:
  port: 8081
  error:
    include-message: always

spring:
  application:
    name: raccoon-cloud-agent
  config:
    import: optional:nacos:localhost:8848
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2:7b
          temperature: 0.7
  neo4j:
    uri: bolt://127.0.0.1:7687
    authentication:
      username: neo4j
      password: Inspection@123456

raccoon:
  neo4j:
    browser-url: http://127.0.0.1:7474
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: Minio@123456
    bucket-name: inspection
    url-expire-days: 7

logging:
  level:
    com.raccoon.cloud.agent: debug
    org.springframework.ai: info
