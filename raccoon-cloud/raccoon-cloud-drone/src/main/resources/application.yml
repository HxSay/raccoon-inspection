server:
  port: 8091
  error:
    include-message: always

spring:
  application:
    name: raccoon-cloud-drone
  ai:
    ollama:
      base-url: http://127.0.0.1:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.1
  config:
    import: optional:nacos:localhost:8848
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hxsay_agent_drone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.raccoon.cloud.drone: debug

raccoon:
  llm:
    task-parse:
      timeout-ms: 5000
      max-retries: 3
      max-input-length: 500
      default-algorithm: RRT*
      default-plan-id: 5
      default-task-id: 6
      default-uav-id: 1
      default-map-id: 1
      default-longitude: 104.000415
      default-latitude: 30.5
      default-takeoff-height: 3.0
      default-cruise-height: 50.0
