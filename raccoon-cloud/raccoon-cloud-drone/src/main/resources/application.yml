server:
  port: 8091
  error:
    include-message: always

spring:
  application:
    name: raccoon-cloud-drone
  ai:
    ollama:
      base-url: http://127.0.0.1:11434
      chat:
        options:
          # 须为本地 Ollama 已安装模型（ollama list）。qwen2:7b 中文解析效果好
          model: qwen2:7b
          temperature: 0.1
  config:
    import: optional:nacos:localhost:8848
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hxsay_agent_drone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.raccoon.cloud.drone: debug

raccoon:
  system:
    base-url: http://localhost:8087
    timeout-ms: 15000
  knowledge:
    # 中央 Agent 任务规划的混合 RAG 知识增强（调用 raccoon-cloud-agent 的 Milvus/Neo4j）
    enabled: true
    # agent 服务地址：直连 8081，或经网关 http://localhost:8080/api/agent
    base-url: http://localhost:8081
    timeout-ms: 1500
    top-k: 5
  llm:
    task-parse:
      # 本地 7B 模型(qwen2:7b)单次推理约 15~20s，超时需放宽，否则会超时降级到规则解析
      timeout-ms: 60000
      max-retries: 2
      max-input-length: 500
      default-algorithm: RRT*
      default-plan-id: 5
      default-task-id: 6
      default-uav-id: 1
      default-map-id: 1
      default-longitude: 104.000415
      default-latitude: 30.5
      default-takeoff-height: 3.0
      default-cruise-height: 50.0
